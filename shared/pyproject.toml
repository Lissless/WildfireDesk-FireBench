[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-shared"
version = "0.1.0"
description = "LLM proxy client and chatbot interface shared by Sage and CivicBench"
requires-python = ">=3.9"
dependencies = ["requests==2.34.2", "urllib3==2.8.0", "python-dotenv==1.2.4"]

[tool.setuptools]
packages = ["llmproxy"]
py-modules = ["civic_chatbot"]
